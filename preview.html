<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Sketch preview</title>
    <style>
      html,
      body,
      #stage {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        touch-action: pan-x pan-y;
      }
      canvas {
        display: block;
        /* Override p5's inline touch-action with the page's no-zoom policy. */
        touch-action: pan-x pan-y !important;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/src/disable-zoom.js"></script>
    <script type="module" src="/src/preview.js"></script>
  </body>
</html>

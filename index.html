<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafafa" />
    <title>Snippets</title>
  </head>
  <body>
    <main>
      <header>
        <h1>Snippets</h1>
      </header>
      <div class="toolbar">
        <label for="demo">Demo</label>
        <select id="demo"></select>
        <button id="restart" type="button">Restart</button>
      </div>
      <div class="workspace">
        <section class="preview-pane" aria-label="Demo preview">
          <div id="stage"></div>
          <p id="description" aria-live="polite"></p>
          <p id="error" role="alert" hidden></p>
        </section>
        <section class="code-pane" aria-label="Code editor">
          <div class="editor-toolbar">
            <span>JavaScript</span>
            <span id="status" role="status">Live preview</span>
            <button id="format" type="button">Format code</button>
            <button id="reset" type="button">Reset code</button>
          </div>
          <div id="editor"></div>
          <p class="editor-hint">
            Edits run automatically. Code formats when you leave the editor, or
            press Alt+Shift+F or Ctrl/Cmd+S. Changes stay in this tab until you
            reload.
          </p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
